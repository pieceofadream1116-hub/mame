name: Restore old UWP files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get old version 0.237
        run: |
          git fetch --depth 1 https://github.com/mamedev/mame.git tag mame0237
          git ls-tree -r --name-only mame0237 | grep -i -E 'uwp|winrt' > old-uwp-files.txt
          cat old-uwp-files.txt

      - name: Put them back on a new branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b uwp-restore
          while read f; do
            if [ ! -e "$f" ]; then
              git checkout mame0237 -- "$f"
              echo "restored $f"
            fi
          done < old-uwp-files.txt
          git add -A
          git commit -m "Bring back UWP files from MAME 0.237"
          git push origin uwp-restore
